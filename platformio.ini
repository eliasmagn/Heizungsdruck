[platformio]
default_envs = esp32_standard

[env:esp32_standard]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  ciniml/WireGuard-ESP32@^0.1.5
  milesburton/DallasTemperature@^4.0.5
  paulstoffregen/OneWire@^2.3.8
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp8266_slim]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4
  milesburton/DallasTemperature@^4.0.5
  paulstoffregen/OneWire@^2.3.8
build_flags =
  -DHEIZUNGSDRUCK_SLIM_PROFILE=1

[env:native]
platform = native
test_framework = unity
build_src_filter =
  +<modules/PressureMath.cpp>
  +<modules/PressureStateMachine.cpp>
  +<modules/AppConfig.cpp>
  +<modules/JsonCodec.cpp>
build_flags =
  -std=gnu++17
